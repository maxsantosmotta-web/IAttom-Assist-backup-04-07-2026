name: External access test build
on:
  push:
    branches: ['test/chatgpt-external-access']
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/api-server exec node scripts/test-chatgpt-sse.mjs
      - run: pnpm --filter @workspace/api-server exec node scripts/test-chatgpt-write-guards.mjs
      - run: pnpm run build:api
      - run: pnpm --filter @workspace/api-server exec node scripts/check-chatgpt-compiled-policy.mjs
      - run: pnpm run typecheck:libs
      # The legacy API currently has unrelated TypeScript errors; keep visibility
      # without hiding the successful isolated adapter build.
      - run: pnpm --filter @workspace/api-server typecheck
        continue-on-error: true
