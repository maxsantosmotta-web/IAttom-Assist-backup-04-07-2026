name: Apply frontend type fixes once

on:
  push:
    branches:
      - consolidacao-blocos-2026-08-01

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'apply remaining frontend type fixes') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: consolidacao-blocos-2026-08-01
          fetch-depth: 0

      - name: Apply exact source replacements
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          admin = Path('artifacts/iattom-assist/src/pages/admin/AdminOverview.tsx')
          text = admin.read_text()
          old = '        const headers = token ? { Authorization: `Bearer ${token}` } : {};'
          new = '        const headers: HeadersInit = token ? { Authorization: `Bearer ${token}` } : {};'
          if old not in text and new not in text:
              raise SystemExit('AdminOverview headers marker not found')
          text = text.replace(old, new)
          admin.write_text(text)

          prompts = Path('artifacts/iattom-assist/src/pages/dashboard/SavedPrompts.tsx')
          text = prompts.read_text()
          old = '.map((item) => `${item.title.trim()}\\n${item.content.trim()}`),'
          new = '.map((item) => `${item.title.trim()}\\n${(item.content ?? "").trim()}`),'
          if old not in text and new not in text:
              raise SystemExit('SavedPrompts content marker not found')
          text = text.replace(old, new)
          prompts.write_text(text)

          dashboard = Path('artifacts/iattom-assist/src/pages/dashboard/DashboardHome.tsx')
          text = dashboard.read_text()
          pattern = re.compile(
              r'  const recentModules = historyData\n'
              r'    \? Array\.from\(new Map\([\s\S]*?\n'
              r'      \)\.values\(\)\)\.slice\(0, 3\)\n'
              r'    : \[\];'
          )
          replacement = '''  const recentModules = (() => {
            const unique = new Map<string, QuickAction>();
            for (const historyItem of historyData ?? []) {
              const normalizedModule = MODULE_ALIASES[historyItem.module] ?? historyItem.module;
              const action = quickActions.find((candidate) => candidate.module === normalizedModule);
              if (!action) continue;
              unique.set(`${action.module}:${action.creativeMode ?? "default"}`, action);
            }
            return [...unique.values()].slice(0, 3);
          })();'''
          updated, count = pattern.subn(replacement, text, count=1)
          if count == 0 and replacement not in text:
              raise SystemExit('Dashboard recent modules marker not found')
          dashboard.write_text(updated if count else text)

          workflow = Path('.github/workflows/apply-frontend-type-fixes.yml')
          if workflow.exists():
              workflow.unlink()
          PY

      - name: Commit source fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "fix(types): apply remaining frontend type fixes"
          git push origin HEAD:consolidacao-blocos-2026-08-01
