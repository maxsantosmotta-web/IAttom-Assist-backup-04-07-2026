name: Validate Play Billing backend

on:
  pull_request:
    branches: [main]
    paths:
      - 'artifacts/api-server/src/lib/googlePlayBillingService.ts'
      - 'artifacts/api-server/src/routes/googlePlayBilling.ts'
      - 'artifacts/api-server/src/routes/googlePlaySubscriptionEntitlements.ts'
      - 'artifacts/api-server/src/routes/index.ts'
      - 'artifacts/api-server/tsconfig.play-billing.json'
      - 'lib/db/src/schema/googlePlayPurchases.ts'
      - 'lib/db/src/schema/index.ts'
      - 'lib/db/drizzle/0001_google_play_purchases.sql'
      - '.github/workflows/validate-play-billing-backend.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Prepare pnpm
        run: corepack prepare pnpm@10.12.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Google Play ledger migration is additive only
        shell: bash
        run: |
          set -euo pipefail
          migration='lib/db/drizzle/0001_google_play_purchases.sql'
          grep -Fq 'CREATE TABLE IF NOT EXISTS "google_play_purchases"' "$migration"
          grep -Fq '"event_key" text NOT NULL UNIQUE' "$migration"
          grep -Fq 'CREATE INDEX IF NOT EXISTS "google_play_purchases_token_idx"' "$migration"
          grep -Fq 'CREATE INDEX IF NOT EXISTS "google_play_purchases_user_idx"' "$migration"
          if grep -Eiq '\b(DROP|TRUNCATE|ALTER[[:space:]]+TABLE|DELETE[[:space:]]+FROM|UPDATE[[:space:]])\b' "$migration"; then
            echo 'Migration contains a destructive or mutating statement.' >&2
            exit 1
          fi

      - name: Existing workspace typecheck — diagnostic only
        continue-on-error: true
        run: pnpm run typecheck

      - name: Typecheck Play Billing files
        run: pnpm --filter @workspace/api-server exec tsc -p tsconfig.play-billing.json --noEmit

      - name: Build API through the real patch chain
        run: pnpm run build:api
