name: Validate Play Billing backend

on:
  pull_request:
    branches: [main]
    paths:
      - 'artifacts/api-server/src/lib/googlePlayBillingService.ts'
      - 'artifacts/api-server/src/routes/googlePlayBilling.ts'
      - 'artifacts/api-server/src/routes/index.ts'
      - 'lib/db/src/schema/googlePlayPurchases.ts'
      - 'lib/db/src/schema/index.ts'
      - 'lib/db/drizzle/0001_google_play_purchases.sql'
      - '.github/workflows/validate-play-billing-backend.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Prepare pnpm
        run: corepack prepare pnpm@10.12.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck workspace
        run: pnpm run typecheck

      - name: Build API through the real patch chain
        run: pnpm run build:api
