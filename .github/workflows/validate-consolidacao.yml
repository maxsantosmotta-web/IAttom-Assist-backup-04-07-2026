name: Validate consolidation branch

# Validation only: this workflow does not deploy or merge.
on:
  push:
    branches:
      - consolidacao-blocos-2026-08-01
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run complete typecheck
        run: pnpm run typecheck

      - name: Build API
        run: pnpm --filter @workspace/api-server build

      - name: Locate credit patch import chain
        run: |
          grep -R -n -E 'patch-credit-history-ui|patch-centralize-credit-balances' artifacts/iattom-assist/scripts artifacts/iattom-assist/package.json || true

      - name: Build frontend
        run: pnpm --filter @workspace/iattom-assist build
