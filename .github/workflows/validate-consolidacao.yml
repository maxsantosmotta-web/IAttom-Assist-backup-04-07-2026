name: Validate consolidation branch

on:
  push:
    branches:
      - consolidacao-blocos-2026-08-01
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run complete typecheck
        run: pnpm run typecheck

      - name: Build API
        run: pnpm --filter @workspace/api-server build

      - name: Build frontend
        run: pnpm --filter @workspace/iattom-assist build
